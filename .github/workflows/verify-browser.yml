name: Browser startup regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/smoke-browser.mjs'
      - 'scripts/smoke-rezero.mjs'
      - 'rezero.html'
      - 'vite.config.js'
      - '.github/workflows/verify-browser.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  chrome-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chrome test dependency
        run: npm install --no-save --no-package-lock playwright-core
      - name: RE:ZERO seated CCTV Chrome boot and capture
        run: node scripts/smoke-rezero.mjs
      - name: Legacy B∞ Chrome boot regression
        run: node scripts/smoke-browser.mjs
      - name: Upload first-room preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rezero-first-room-preview
          path: rezero-first-room.png
          if-no-files-found: ignore
